[project]
name = "control-point-exporter"
version = "1.0.1"
description = "Standalone Windows EAD control point exporter"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["lxml>=6.0,<7", "openpyxl>=3.1.5,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7"]

[project.scripts]
control-point-exporter = "control_point_exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_point_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Native fd capture interferes with repeated Windows Tcl/Tk tests on this host.
# Capture Python streams while leaving native standard handles intact.
addopts = "--capture=sys"

